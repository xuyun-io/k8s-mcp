name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Verify version matches release tag
      run: |
        CODE_VERSION=$(node -p "require('./package.json').version")
        TAG_VERSION=${GITHUB_REF_NAME#v}
        if [ -n "$TAG_VERSION" ] && [ "$CODE_VERSION" != "$TAG_VERSION" ]; then
          echo "Error: Version mismatch!"
          echo "Code version (package.json): $CODE_VERSION"
          echo "Release tag: $TAG_VERSION"
          echo "Please ensure the version in package.json matches the release tag."
          exit 1
        fi
        echo "Version verified: $CODE_VERSION"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'

    - name: Check if version exists
      id: check
      run: |
        VERSION=$(node -p "require('./package.json').version")
        if npm view k8s-mcp@$VERSION version 2>/dev/null; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Version $VERSION already exists on npm, skipping publish"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Version $VERSION not found, will publish"
        fi

    - name: Publish to npm
      if: steps.check.outputs.exists != 'true'
      run: npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

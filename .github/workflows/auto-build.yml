name: Auto Build on Push

on:
  push:
    branches: [master, main]

jobs:
  build:
    name: Build and Publish Development Version
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    # Skip version bump commits and manual skip
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[release]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build version
        id: version
        run: |
          BASE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          BUILD=$(git rev-list --count HEAD)
          DATE=$(date +%Y.%-m.%-d)
          DEV_VERSION="${DATE}.${BUILD}"
          echo "base=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "dev=$DEV_VERSION" >> $GITHUB_OUTPUT
          echo "Development version: $DEV_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Python version for build
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.dev }}\"/" pyproject.toml

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm version for build
        run: |
          NPM_V="${{ steps.version.outputs.dev }}"
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json')); pkg.version='$NPM_V'; fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    name: Publish k8s-mcp to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify version matches release tag
      run: |
        CODE_VERSION=$(python setup.py --version)
        TAG_VERSION=${GITHUB_REF_NAME#v}
        if [ -n "$TAG_VERSION" ] && [ "$CODE_VERSION" != "$TAG_VERSION" ]; then
          echo "Error: Version mismatch!"
          echo "Code version (setup.py): $CODE_VERSION"
          echo "Release tag: $TAG_VERSION"
          echo "Please ensure the version in setup.py matches the release tag."
          exit 1
        fi
        echo "Version verified: $CODE_VERSION"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Check if version exists on PyPI
      id: check
      run: |
        VERSION=$(python setup.py --version)
        if pip index versions k8s-mcp 2>/dev/null | grep -q "$VERSION"; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Version $VERSION already exists on PyPI, skipping publish"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Version $VERSION not found, will publish"
        fi

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      if: steps.check.outputs.exists != 'true'
      uses: pypa/gh-action-pypi-publish@release/v1

    - name: Upload wheel to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz

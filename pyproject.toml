[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-mcp"
version = "0.1.3"
authors = [
    {name = "kubestar", email = "1851616111@qq.com"},
]
description = "A Model Context Protocol (MCP) server for Kubernetes with 270+ tools, 8 resources, and 8 prompts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = [
    "kubernetes",
    "mcp",
    "model-context-protocol",
    "kubectl",
    "helm",
    "ai-assistant",
    "claude",
    "cursor",
    "windsurf",
    "fastmcp",
    "devops",
    "cloud-native",
    "mcp-ui",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
]
dependencies = [
    "fastmcp>=3.0.0b1",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "starlette>=0.27.0",
    "kubernetes>=28.1.0",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "urllib3>=2.1.0",
    "websocket-client>=1.7.0",
    "jsonschema>=4.20.0",
    "cryptography>=42.0.2",
    "rich>=13.0.0",
    "aiohttp>=3.8.0",
    "aiohttp-sse>=2.1.0",
]

[project.optional-dependencies]
ui = ["mcp-ui-server>=0.5.0"]
all = ["mcp-ui-server>=0.5.0"]

[project.scripts]
k8s-mcp-ctl = "k8s_mcp.ctl.main:main"
k8s-mcp-server = "k8s_mcp.server.main:main"

[project.urls]
"Bug Tracker" = "https://github.com/xuyun-io/k8s-mcp/issues"
Documentation = "https://github.com/xuyun-io/k8s-mcp#readme"
Source = "https://github.com/xuyun-io/k8s-mcp"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
